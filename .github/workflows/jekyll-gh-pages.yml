name: Publish ASCII layout workbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this dedicated workbook
        uses: actions/checkout@v4
      - name: Verify original source and prepare a build-only index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          source = Path('README.md').read_bytes()
          expected = '65162ae8d2774c3bf35c152a723d973bfd3ba61233ceaad486e0dc17180dc1d9'
          assert hashlib.sha256(source).hexdigest() == expected, 'README changed; review before publishing'
          text = source.decode('utf-8')
          assert '[ascii art maker](https://asciiartgenerator.online/)' in text
          assert 'Disclosure: I help promote ASCII Art Generator.' in text
          assert 'AI-assisted project material' in text
          Path('index.md').write_text('---\nlayout: default\ntitle: ASCII layout review workbook\n---\n\n' + text, encoding='utf-8')
          Path('_config.yml').write_text('title: ASCII layout review workbook\ndescription: A practical manual character-grid handoff guide\nbaseurl: /ascii-layout-review-workbook\nurl: https://linnfeng.github.io\ntheme: jekyll-theme-cayman\n', encoding='utf-8')
          assert Path('README.md').read_bytes() == source
          PY
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build the complete guide with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload the built page
        uses: actions/upload-pages-artifact@v3
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the verified workbook
        id: deployment
        uses: actions/deploy-pages@v5
